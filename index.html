<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF5F2"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11181E"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BONA"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>BONA DIARY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&display=swap">
<style>
/* 방안 공책 위 스티커 다이어리: 위 머리, 가운데 한 줄 카드, 아래 고정 탭 */
:root{
  --paper:#EEF5F2; --grid:#DCE8E3; --card:#FFFFFF; --ink:#22314A; --soft:#56657A; --line:#D3E0DB;
  --berry:#B8294F; --on-berry:#FFFFFF; --berry-bg:#FCE6EC;
  --sun:#E9A30C; --sun-ink:#7A5200; --sun-bg:#FFF2CC;
  --mint:#137A63; --mint-bg:#DCF3EA;
  --display:"Jua","Gowun Dodum",system-ui,"Malgun Gothic",sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11181E; --grid:#18222A; --card:#1A242D; --ink:#EAF0F3; --soft:#A6B3BF; --line:#2B3843;
  --berry:#FF7D9B; --on-berry:#2A0E17; --berry-bg:#3A1E28;
  --sun:#F5C24C; --sun-ink:#F5C24C; --sun-bg:#372E15;
  --mint:#52CCAC; --mint-bg:#163A31; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11181E; --grid:#18222A; --card:#1A242D; --ink:#EAF0F3; --soft:#A6B3BF; --line:#2B3843;
  --berry:#FF7D9B; --on-berry:#2A0E17; --berry-bg:#3A1E28;
  --sun:#F5C24C; --sun-ink:#F5C24C; --sun-bg:#372E15;
  --mint:#52CCAC; --mint-bg:#163A31; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
textarea.field{display:block;width:100%;resize:vertical;font-family:ui-monospace,Consolas,monospace}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(110px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:1.6rem;letter-spacing:.06em;color:var(--berry)}
.brand small{display:block;font-size:.8rem;letter-spacing:.02em;color:var(--soft);font-family:var(--body)}
.save-dot{font-size:.78rem;color:var(--soft);text-align:right}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.wrap{grid-template-columns:minmax(0,1fr)}
main#view{width:100%}
.wrap>*,.card>*,.add>*,.set-task>*,.row>*{min-width:0}
input.field{width:100%}
.set-task .field{flex:1 1 0}
.card-h .muted{flex:1 1 auto;text-align:right}
.add>.btn,.row>.x,.row>.amt,.row>.chk,.set-task>.x,.set-task>.icbtn{flex:none;white-space:nowrap}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-h h2{font-size:1.25rem}
.muted{color:var(--soft);font-size:.9rem}

.datebar{display:flex;align-items:center;gap:8px}
.datebar h2{flex:1;text-align:center;font-size:1.3rem}
.round{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.round:disabled{opacity:.35;cursor:default}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.9rem}

.stickers{background:var(--sun-bg);border-color:transparent;grid-template-columns:auto 1fr;align-items:center;column-gap:16px}
.big-star{width:72px;height:72px;color:var(--sun);position:relative;display:grid;place-items:center}
.big-star svg{width:72px;height:72px}
.big-star b{position:absolute;font-family:var(--display);font-weight:400;font-size:1.35rem;color:#5A3D00;padding-top:6px}
.stk-txt{display:grid;gap:6px;min-width:0}
.stk-txt h2{font-size:1.15rem;color:var(--sun-ink)}
.bar{height:14px;border-radius:999px;background:var(--card);overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .4s}
.bar.mint i{background:var(--mint)}
.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--berry);color:var(--on-berry);font-family:var(--display);font-size:1.05rem;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;min-height:40px;font-size:.95rem}
.btn.armed{background:var(--ink);color:var(--card)}

.tasks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:380px){.tasks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.task{position:relative;border:2px solid var(--line);background:var(--card);border-radius:16px;min-height:96px;padding:12px 8px;
  display:grid;place-items:center;gap:6px;text-align:center;font-family:var(--display);font-size:1rem;line-height:1.2;transition:transform .12s}
.task .ic{width:30px;height:30px;color:var(--soft)}
.task:active{transform:scale(.96)}
.task[aria-pressed="true"]{background:var(--mint-bg);border-color:var(--mint);color:var(--mint)}
.task[aria-pressed="true"] .ic{color:var(--mint)}
.stamp{position:absolute;top:-8px;right:-6px;width:30px;height:30px;color:var(--sun);transform:rotate(14deg)}
.task[aria-pressed="true"] .stamp{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25) rotate(20deg)}100%{transform:scale(1) rotate(14deg)}}
.cheer{background:var(--mint-bg);color:var(--mint);border-radius:14px;padding:10px 14px;font-family:var(--display);text-align:center}

.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;min-width:0}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:var(--card)}
.chk[aria-pressed="true"]{background:var(--mint);border-color:var(--mint)}
.done-txt{text-decoration:line-through;color:var(--soft)}
.x{border:0;background:transparent;color:var(--soft);padding:6px 8px;border-radius:8px;font-size:.85rem;white-space:nowrap}
.x.armed{background:var(--berry);color:var(--on-berry)}

form.add{display:flex;gap:8px;flex-wrap:wrap}
.field{flex:1 1 160px;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px}
.field::placeholder{color:var(--soft);opacity:.85}
label.lb{display:grid;gap:4px;font-size:.9rem;color:var(--soft);flex:1 1 160px;min-width:0}
label.lb .field{color:var(--ink)}
.err{color:var(--berry);font-size:.88rem;margin:0}
.ok{color:var(--mint);font-size:.88rem;margin:0}

.study{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.study .num{font-size:2.2rem;line-height:1}
.study .num small{font-size:1rem;color:var(--soft)}
.steps{display:flex;gap:8px;flex-wrap:wrap}

.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:10px;font-family:var(--display);min-height:46px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.quick{display:flex;gap:6px;flex-wrap:wrap}

.money-big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.money-big .num{font-size:2.3rem;line-height:1.1}
.in{color:var(--mint)} .out{color:var(--berry)}
.amt{font-family:var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini div{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.mini b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem}

.stars{display:flex;gap:2px}
.stars button{border:0;background:transparent;padding:4px;color:var(--line)}
.stars button[aria-pressed="true"]{color:var(--sun)}
.stars button .ic{width:32px;height:32px}
.mstars{color:var(--sun);display:inline-flex}
.mstars .ic{width:16px;height:16px}

.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.grid{border-collapse:separate;border-spacing:3px;font-size:.85rem}
table.grid th{font-weight:400;color:var(--soft);white-space:nowrap;padding:2px 4px}
table.grid th.rowh{text-align:left;color:var(--ink);font-family:var(--display);position:sticky;left:0;background:var(--card);padding-right:8px}
table.grid td{width:30px;height:30px;text-align:center;border-radius:8px;background:var(--paper)}
table.grid td.on{background:var(--mint-bg);color:var(--mint)}
table.grid td.on .ic{width:16px;height:16px}
table.grid td.n{font-family:var(--display);background:transparent;color:var(--ink)}
th.today{color:var(--berry)!important;font-family:var(--display)}
th.sun{color:var(--berry)!important}

.set-task{display:flex;align-items:center;gap:8px}
.icbtn{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.note{font-size:.85rem;color:var(--soft);margin:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1.5px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in-nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
nav.tabs button{border:0;background:transparent;display:grid;place-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--soft);font-family:var(--display);font-size:.82rem;min-height:54px}
nav.tabs button[aria-current="page"]{color:var(--berry);background:var(--berry-bg)}
.empty{text-align:center;color:var(--soft);padding:14px 8px;border:1.5px dashed var(--line);border-radius:14px}

/* 미니게임 */
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gcard{border:2px solid var(--line);border-radius:16px;padding:14px 10px;display:grid;gap:8px;justify-items:center;text-align:center;background:var(--card)}
.gcard .ic{width:40px;height:40px;color:var(--berry)}
.gcard h3{font-size:1.15rem}
.gcard .muted{word-break:keep-all}
.gcard .btn{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.lock{background:var(--sun-bg);color:var(--sun-ink);border-radius:14px;padding:12px 14px;font-family:var(--display);text-align:center}
.memo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mcard{aspect-ratio:1;border-radius:14px;border:2px solid transparent;background:var(--berry);color:var(--on-berry);display:grid;place-items:center;padding:0;transition:transform .15s}
.mcard .ic{width:36px;height:36px}
.mcard .back{opacity:.45;width:26px;height:26px}
.mcard.open{background:var(--card);color:var(--ink);border-color:var(--sun);transform:scale(1.04)}
.mcard.done{background:var(--mint-bg);color:var(--mint);border-color:var(--mint)}
.qbox{font-family:var(--display);font-size:2.4rem;line-height:1.2;text-align:center;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts .btn{font-size:1.5rem;min-height:64px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.fb{text-align:center;font-family:var(--display);min-height:1.5em;margin:0}
.fb.good{color:var(--mint)} .fb.bad{color:var(--berry)}
.gstat{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display)}
.gstat .num{font-size:1.3rem}
.result{text-align:center;display:grid;gap:8px;justify-items:center}
.result .num{font-size:2.6rem;line-height:1.1;color:var(--berry)}
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;touch-action:manipulation}
.hole{aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0;
  font-family:var(--display);font-size:1.6rem;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hole .ic{width:58%;height:58%}
.hole.star{border-color:var(--sun);background:var(--sun-bg);color:var(--sun)}
.hole.star .ic{animation:popup .18s ease-out}
.hole.bee{border-color:var(--ink);background:var(--sun-bg);color:var(--ink)}
.hole.bee .ic{animation:popup .18s ease-out}
.hole.hit{border-color:var(--mint);background:var(--mint-bg);color:var(--mint)}
.hole.ouch{border-color:var(--berry);background:var(--berry-bg);color:var(--berry);animation:shake .3s}
@keyframes popup{from{transform:translateY(40%) scale(.4)}to{transform:none}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#rv{display:block;width:100%;height:min(46vh,320px);border-radius:14px;background:var(--paper);border:1.5px solid var(--line);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{display:block;width:100%;height:min(56vh,440px);border-radius:14px;background:var(--paper);border:1.5px solid var(--line);touch-action:none}
.lives{color:var(--berry);letter-spacing:2px}

/* 일정 (학교 주간 + 학원) */
.wkbar{display:flex;align-items:center;gap:8px}
.wkbar h2{flex:1;text-align:center;font-size:1.15rem}
.dchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dchip{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0 10px;display:grid;justify-items:center;font-family:var(--display);line-height:1.15;min-height:54px}
.dchip span{font-size:.8rem;color:var(--soft)}
.dchip b{font-weight:400;font-size:1.1rem}
.dchip.is-today{border-color:var(--berry)}
.dchip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.dchip[aria-pressed="true"] span{color:inherit}
.dchip i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--berry)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;min-width:0}
.prow>.grow{flex:1;min-width:0}
.pn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--display)}
.prow.test{border-color:var(--berry);background:var(--berry-bg)}
.prow.ac{border-style:dashed;border-color:var(--mint)}
.prow.ac .pn{background:var(--mint-bg);color:var(--mint)}
.prow.ac .pn .ic{width:18px;height:18px}
.ps{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ps b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.pw{font-size:.92rem;overflow-wrap:anywhere}
.tag{background:var(--berry);color:var(--on-berry);border-radius:6px;padding:0 6px;font-size:.75rem;font-family:var(--display)}
.bring{background:var(--sun-bg);border-radius:14px;padding:10px 14px;overflow-wrap:anywhere}
.bring b{font-family:var(--display);font-weight:400;color:var(--sun-ink);display:block}
.evt{background:var(--berry-bg);color:var(--berry);border-radius:12px;padding:8px 12px;font-family:var(--display)}
.subj{display:flex;flex-wrap:wrap;gap:6px}
.sp{border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.9rem}
.sp b{font-family:var(--display);font-weight:400;color:var(--soft);margin-right:4px}
.sp.test{border-color:var(--berry);color:var(--berry)}
.wdays{display:flex;gap:4px;flex-wrap:wrap}
.wdays button{min-width:40px;min-height:40px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-family:var(--display)}
.wdays button[aria-pressed="true"]{background:var(--mint);color:var(--card);border-color:var(--mint)}
.notes{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:.92rem;overflow-wrap:anywhere}
input[type="time"].field{min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two .field{width:100%}
/* 아이폰: 시간·선택 칸은 원래 최소 폭이 있어 이름표(label)가 넓어지며 카드 밖으로 나감 → 칸 폭에 맞추기 */
label.lb{grid-template-columns:minmax(0,1fr)}
input[type="time"].field,select.field{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%}
input[type="time"].field::-webkit-date-and-time-value{text-align:left;min-height:1.5em}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
.meal{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.meal li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.meal li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint);flex:none}
.meal li.warn{color:var(--berry);font-family:var(--display)}
.meal li.warn::before{background:var(--berry)}
.meal-tag{background:var(--mint-bg);color:var(--mint);border-radius:999px;padding:2px 10px;font-family:var(--display);font-size:.85rem;justify-self:start}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills .pill[aria-pressed="true"]{background:var(--berry);color:var(--on-berry);border-color:var(--berry)}

/* 기분 */
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0;display:grid;justify-items:center;gap:0;font-family:var(--display)}
.mood span{font-size:1.7rem;line-height:1.2}
.mood small{font-size:.78rem;color:var(--soft)}
.mood[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-bg)}
.mood[aria-pressed="true"] small{color:var(--sun-ink)}
table.grid td.emo{font-size:1rem;background:transparent}
/* 단어 */
.word-en{font-family:var(--display);font-size:1.1rem}
.say{border:0;background:transparent;padding:4px 6px;border-radius:8px;font-size:1.05rem;flex:none}
.wstat{font-size:.75rem;color:var(--soft);white-space:nowrap}
.wq{text-align:center;display:grid;gap:4px;justify-items:center}
.wq .big{font-family:var(--display);font-size:2.1rem;line-height:1.2;overflow-wrap:anywhere}
.opts.words .btn{font-size:1.1rem;min-height:58px;overflow-wrap:anywhere;padding:8px}
details.more summary{cursor:pointer;color:var(--soft);font-size:.9rem;padding:4px 0}
/* 읽는 중 */
.rbook{display:grid;gap:8px;padding:12px;border:1.5px solid var(--line);border-radius:14px}
.rbook .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.rbook .top b{font-family:var(--display);font-weight:400;font-size:1.05rem;overflow-wrap:anywhere}
.rctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rctl .field{flex:1 1 90px;min-height:40px}
/* 용돈 분류 */
.cbar{display:grid;grid-template-columns:5.2em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.92rem}
.cbar span{font-family:var(--display)}
.cbar b{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat{font-size:.78rem;border:1.5px solid var(--line);border-radius:999px;padding:0 8px;color:var(--soft);white-space:nowrap}
.mnav{display:flex;align-items:center;gap:6px}
.mnav .round{width:36px;height:36px}
.task span,.stk-txt h2{word-break:keep-all}

/* 11-15 공간 줄이기: 스티커 카드 한 줄 + 할 일은 알약 칩 */
.stickers{padding:10px 14px;column-gap:12px}
.big-star,.big-star svg{width:46px;height:46px}
.big-star b{font-size:1.05rem;padding-top:3px}
.stk-txt{gap:5px}
.stk-txt h2{font-size:1rem;line-height:1.3}
.stickers .stk-txt>.muted{display:none}
.stickers .bar{height:10px}
.tasks{display:flex;flex-wrap:wrap;gap:7px}
.task{min-height:42px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;font-size:.92rem;text-align:left}
.task .ic{width:18px;height:18px}
.task .stamp{position:static;transform:none;order:3;width:16px;height:16px}
.task[aria-pressed="true"] .stamp{animation:popin .3s ease-out}
@keyframes popin{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
:root[data-skin] .tasks .task{border-radius:999px}

/* ===== 테마 (설정에서 고름: html[data-skin] = A 지금 · B 파스텔 · C 다꾸 · D 하늘) ===== */
/* B. 파스텔 스티커북 */

    --sun:#FFB938;--sun-bg:#FFF1CF;--sun-ink:#7A5000;--mint:#13785F;--mint-bg:#DDF6EE}

  :root[data-skin="B"] .task:nth-child(6n+3){background:#FFF3D6} :root[data-skin="B"] .task:nth-child(6n+4){background:#E3F7EE}
  :root[data-skin="B"] .task:nth-child(6n+5){background:#F0E8FF} :root[data-skin="B"] .task:nth-child(6n){background:#FFEADF}

  :root[data-skin="B"] .gcard:nth-child(5n+4){background:#EFFAF5} :root[data-skin="B"] .gcard:nth-child(5n){background:#F5F0FF}

/* C. 다꾸 플래너 */

<script>
const APP_VER = '11-15 c';   // 고칠 때마다 바꿔서 핸드폰에 새 판이 왔는지 확인

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const WD = '일월화수목금토';
const longDate = s => { const d = parseD(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; };
const shortDate = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const won = n => (Math.round(n) || 0).toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- 기본값 ---------- */
const TASK_ICONS = ['tooth', 'pencil', 'book', 'clock', 'bag', 'heart', 'music', 'run', 'star'];
const DEFAULT_SETTINGS = {
  kind: 'settings',
  tasks: [
    { id: 't1', name: '아침 양치', ic: 'tooth' },
    { id: 't2', name: '저녁 양치', ic: 'tooth' },
    { id: 't3', name: '숙제', ic: 'pencil' },
    { id: 't4', name: '책 읽기', ic: 'book' },
    { id: 't5', name: '공부', ic: 'clock' },
    { id: 't6', name: '가방 챙기기', ic: 'bag' },
  ],
  goal: 30, reward: '주말에 영화 보기',
  saveName: '갖고 싶은 것', saveGoal: 30000,
  gameLock: true,            // true = 오늘 할 일을 다 해야 게임이 열림
  academies: [],             // 학원: { id, name, days:[0~6, 0=일], start:'15:00', end:'16:30', bring }
  allergy: [],               // 급식 알레르기 번호 (1~19)
  anniv: [],                 // 생일·기념일: { id, name, m, d, kind:'생일'|'기념일' }
  theme: 'A',                // A 지금 · B 파스텔 · C 다꾸 · D 하늘 · auto 매일 바뀌기
  gameLimit: 30,             // 하루 게임 시간(분), 0 = 제한 없음
};
const SKINS = [
  { k: 'A', name: '방안 공책', sw: ['#EEF5F2', '#B8294F', '#137A63', '#E9A30C'] },
  { k: 'B', name: '파스텔 스티커북', sw: ['#FFF4F8', '#B42A60', '#E6F0FF', '#FFB938'] },
  { k: 'C', name: '다꾸 플래너', sw: ['#F5EFE3', '#A33F2C', '#3F6C52', '#D9A441'] },
  { k: 'D', name: '청량 하늘', sw: ['#BFDDFF', '#1F55D6', '#0B7A5E', '#FFB020'] },
];
function skinToday() {
  const t = S.settings.theme || 'A';
  if (t !== 'auto') return t;
  const n = Math.floor(parseD(today()).getTime() / 864e5 + 0.5);   // 날짜마다 하나씩 돌아가며
  return SKINS[((n % 4) + 4) % 4].k;
}
const MOODS = [{ e: '😆', t: '최고' }, { e: '🙂', t: '좋아' }, { e: '😐', t: '그냥' }, { e: '😢', t: '슬퍼' }, { e: '😠', t: '화나' }];
const OUT_CATS = ['간식', '학용품', '놀이', '선물', '교통', '기타'];
const ALLERGENS = ['', '난류', '우유', '메밀', '땅콩', '대두', '밀', '고등어', '게', '새우', '돼지고기', '복숭아', '토마토', '아황산류', '호두', '닭고기', '쇠고기', '오징어', '조개류', '잣'];

/* ---------- 상태 ---------- */
let docs = {};              // key -> body (저장소 그대로)
let S = build(docs);        // 화면에서 쓰는 모양
const UI = { tab: 'today', date: today(), followToday: true, moneyType: 'in', stars: 0, msg: {} };

function build(d) {
  const s = { settings: clone(DEFAULT_SETTINGS), days: {}, money: [], books: [], rewards: [], games: { kind: 'games' }, weeks: {}, meals: {}, words: [], reading: [] };
  for (const [k, b] of Object.entries(d)) {
    if (!b) continue;
    if (b.kind === 'word') { s.words.push({ ...b, key: k }); continue; }
    if (b.kind === 'reading') { s.reading.push({ ...b, key: k }); continue; }
    if (b.kind === 'week') { s.weeks[b.start] = b; continue; }
    if (b.kind === 'meal') { s.meals[b.month] = b; continue; }
    if (b.kind === 'settings') s.settings = Object.assign(clone(DEFAULT_SETTINGS), b);
    else if (b.kind === 'games') s.games = b;
    else if (b.kind === 'day') s.days[b.date] = b;
    else if (b.kind === 'money') s.money.push({ ...b, key: k });
    else if (b.kind === 'book') s.books.push({ ...b, key: k });
    else if (b.kind === 'reward') s.rewards.push({ ...b, key: k });
  }
  const byDate = (a, b) => (b.date + (b.at || '')).localeCompare(a.date + (a.at || ''));
  s.money.sort(byDate); s.books.sort(byDate); s.rewards.sort(byDate);
  s.words.sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  s.reading.sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  return s;
}
const dayOf = date => S.days[date] || { kind: 'day', date, done: {}, study: 0, hw: [] };
const earned = () => Object.values(S.days).reduce((n, d) => n + Object.values(d.done || {}).filter(Boolean).length, 0);
const spent = () => S.rewards.reduce((n, r) => n + (+r.cost || 0), 0);
const balance = () => S.money.reduce((n, m) => n + (m.type === 'in' ? 1 : -1) * (+m.amount || 0), 0);

const LS = 'bonaDiary.v1';
const store = { ok: true };

function localLoad() { try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { store.ok = false; return {}; } }
function localSave() {
  try { localStorage.setItem(LS, JSON.stringify(docs)); localStorage.setItem(LS + '.at', today()); store.ok = true; setDot('이 핸드폰에 저장됨'); }
  catch (e) { store.ok = false; setDot('저장이 안 돼요! 설정 → 백업을 해 두세요'); }
}

function put(key, body) {          // body === null 이면 지우기
  if (body === null) delete docs[key]; else docs[key] = body;
  S = build(docs); localSave(); render();
}
function putMany(map) {            // 여러 개를 한 번에 저장하고 한 번만 다시 그리기
  for (const [k, v] of Object.entries(map)) { if (v === null) delete docs[k]; else docs[k] = v; }
  S = build(docs); localSave(); render();
}

function setDot(t) { document.getElementById('saveDot').textContent = t; }

function initStore() {
  docs = localLoad(); S = build(docs);
  try { localStorage.setItem(LS + '.test', '1'); localStorage.removeItem(LS + '.test'); } catch (e) { store.ok = false; }
  setDot(store.ok ? '이 핸드폰에 저장됨' : '이 화면에선 저장이 안 돼요');
  render();
}

const view = document.getElementById('view');

function render() {
  // 입력 중인 칸 지키기
  const keep = {}; let focusId = null, sel = null;
  view.querySelectorAll('input[id],textarea[id]:not([readonly]),select[id]').forEach(i => { keep[i.id] = i.value; });
  const a = document.activeElement;
  if (a && a.id && view.contains(a)) { focusId = a.id; try { sel = [a.selectionStart, a.selectionEnd]; } catch (e) {} }

  if (UI.followToday) UI.date = today();
  const sk = skinToday(); if (document.documentElement.dataset.skin !== sk) document.documentElement.dataset.skin = sk;
  const f = { today: vToday, sched: vSched, money: vMoney, books: vBooks, game: vGame, log: vLog, set: vSet }[UI.tab];
  view.innerHTML = f();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === UI.tab ? 'page' : 'false'));

  for (const [id, v] of Object.entries(keep)) { const i = document.getElementById(id); if (i && i.type !== 'hidden') i.value = v; }
  if (focusId) { const i = document.getElementById(focusId); if (i) { i.focus(); if (sel && i.setSelectionRange) try { i.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}

        <button class="x" data-act="del" data-key="${esc(b.key)}">지우기</button>
      </li>`).join('')}</ul>` : `<div class="empty">다 읽은 책을 적으면 여기 책장에 쌓여요.</div>`}
  </section>`;
}

/* ---------- 일정: 학교 주간학습안내 + 학원 ---------- */
const WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
const mondayOf = s => { const d = parseD(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const schoolDay = date => { const w = S.weeks[mondayOf(date)]; return (w && (w.days || []).find(d => d.date === date)) || null; };
const eventsOn = date => { const w = S.weeks[mondayOf(date)]; return ((w && w.events) || []).filter(e => e.date === date); };
const acadOn = date => { const wd = parseD(date).getDay(); return (S.settings.academies || []).filter(a => (a.days || []).includes(wd)).sort((a, b) => (a.start || '').localeCompare(b.start || '')); };
const relDay = d => d === addDays(today(), 1) ? '내일' : `${parseD(d).getDate()}일 ${WD[parseD(d).getDay()]}요일`;
const acTime = a => (a.start || '') + (a.end ? '~' + a.end : '');

/* 생일·기념일: 해마다 같은 월·일 (음력은 해마다 날짜를 바꿔 넣기) */
const annivOn = date => { const d = parseD(date); return (S.settings.anniv || []).filter(a => +a.m === d.getMonth() + 1 && +a.d === d.getDate()); };
function annivSoon(days) {   // 오늘부터 days 일 안에 오는 것 [{a, date, n}]
  const out = [];
  for (let i = 0; i <= days; i++) { const dt = addDays(today(), i); annivOn(dt).forEach(a => out.push({ a, date: dt, n: i })); }
  return out;
}
const annivIcon = a => a.kind === '생일' ? '🎂' : '🎉';
const annivText = x => x.n === 0 ? `${annivIcon(x.a)} 오늘은 ${x.a.name}${x.a.kind === '생일' ? ' 생일' : ''}이에요!`
  :`${annivIcon(x.a)} D-${x.n} ${x.a.name}${x.a.kind === '생일' ? ' 생일' : ''} (${+x.date.slice(5, 7)}/${+x.date.slice(8)})`;
function nextAnniv(a) {      // 다음에 오는 날까지 며칠
  const t = parseD(today()); let y = t.getFullYear();
  for (let k = 0; k < 2; k++, y++) { const d = new Date(y, +a.m - 1, +a.d); if (d.getMonth() === +a.m - 1 && d >= t) return Math.round((d - t) / 864e5); }
  return 999;
}

function nextBring() {          // 앞으로 사흘 안에 챙길 것이 있는 첫날
  for (let i = 1; i <= 3; i++) {
    const d = addDays(today(), i), sd = schoolDay(d);
    const items = [...((sd && sd.bring) || []), ...acadOn(d).filter(a => a.bring).map(a => `${a.name}: ${a.bring}`)];
    if (items.length) return { date: d, items };
  }
  return null;
}

학교 이름·전화번호 같은 정보는 넣지 마. 급식이 있는 날만 넣어 줘.
{"app":"bonaDiary-meal","month":"YYYY-MM",
 "days":[{"date":"YYYY-MM-DD","tag":"그날 이름이 있으면 (예: 생일축하날), 없으면 빈칸",
   "menu":[{"name":"음식 이름 (알레르기 번호 괄호는 빼고)","al":[알레르기 번호 숫자들]}],
   "kcal":에너지 숫자}]}`;

const isD = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const cleanStr = (v, max) => String(v ?? '').replace(/\s+/g, ' ').trim().slice(0, max);
function parseLoose(raw) {
  const txt = String(raw || '').trim();
  try { return JSON.parse(txt); } catch (e) {
    const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
    if (a >= 0 && b > a) try { return JSON.parse(txt.slice(a, b + 1)); } catch (e2) {}
  }
  return null;
}
function parseMeals(j) {
  if (!j || typeof j !== 'object') return null;
  const out = [];
  for (const m of (Array.isArray(j.meals) ? j.meals : [j])) {
    if (!m || !Array.isArray(m.days) || !Array.isArray((m.days[0] || {}).menu)) continue;
    const days = m.days.filter(d => d && isD(d.date) && Array.isArray(d.menu)).slice(0, 31).map(d => ({
      date: d.date, tag: cleanStr(d.tag, 30), kcal: Math.round((+d.kcal || 0) * 10) / 10,
      menu: d.menu.filter(x => x && (x.name || typeof x === 'string')).slice(0, 12).map(x => typeof x === 'string' ? { name: cleanStr(x, 40), al: [] }
        : { name: cleanStr(x.name, 40), al: (Array.isArray(x.al) ? x.al : []).map(n => parseInt(n, 10)).filter(n => n >= 1 && n <= 19).slice(0, 19) }),
    })).filter(d => d.menu.length);
    if (!days.length) continue;
    const months = [...new Set(days.map(d => d.date.slice(0, 7)))];
    for (const mo of months) out.push({ kind: 'meal', month: mo, at: new Date().toISOString(), days: days.filter(d => d.date.startsWith(mo)) });
  }
  return out.length ? out : null;
}
const mealOn = date => { const m = S.meals[date.slice(0, 7)]; return (m && m.days.find(d => d.date === date)) || null; };
function mealHtml(ml) {
  const mine = S.settings.allergy || [];
  return `${ml.tag ? `<span class="meal-tag">${esc(ml.tag)}</span>` : ''}
    <ul class="meal">${ml.menu.map(x => {
      const hit = (x.al || []).filter(n => mine.includes(n));
      return `<li class="${hit.length ? 'warn' : ''}">${esc(x.name)}${hit.length ? ` <span class="tag">주의: ${hit.map(n => ALLERGENS[n]).join(', ')}</span>` : ''}</li>`;
    }).join('')}</ul>`;
}

function parseWeeks(raw) {
  const j = typeof raw === 'object' && raw ? raw : parseLoose(raw);
  if (!j || typeof j !== 'object') return null;
  const str = cleanStr;
  const list = (v, max, n) => (Array.isArray(v) ? v : v ? String(v).split(/[,\n]/) : []).map(x => str(x, max)).filter(Boolean).slice(0, n);
  const out = [];
  for (const w of (Array.isArray(j.weeks) ? j.weeks : [j])) {
    if (!w || !Array.isArray(w.days) || Array.isArray((w.days[0] || {}).menu)) continue;
    const days = w.days.filter(d => d && isD(d.date)).slice(0, 7).map(d => ({
      date: d.date,
      periods: (Array.isArray(d.periods) ? d.periods : []).filter(p => p && typeof p === 'object').slice(0, 10)
        .map((p, i) => ({ n: Math.min(10, Math.max(1, parseInt(p.n, 10) || i + 1)), subj: str(p.subj, 30), what: str(p.what, 240), page: str(p.page, 40), test: p.test === true })),
      bring: list(d.bring, 60, 20),
    }));
    if (!days.length) continue;
    out.push({
      kind: 'week', start: mondayOf(isD(w.start) ? w.start : days[0].date), at: new Date().toISOString(),
      times: list(w.times, 20, 10), days,
      notes: list(w.notes, 300, 20),
      events: (Array.isArray(w.events) ? w.events : []).filter(e => e && isD(e.date)).map(e => ({ date: e.date, text: str(e.text, 80) })).filter(e => e.text).slice(0, 20),
    });
  }
  return out.length ? out : null;
}

/* ---------- 미니게임 ---------- */
const MEMO_ICONS = ['tooth', 'book', 'pencil', 'bag', 'clock', 'heart', 'music', 'run'];
const MATH_SEC = 60, WHACK_SEC = 30;
const GAMES = {
  run: { name: '별빛 달리기', ic: 'run', desc: '톡 눌러 점프! 벌은 밑으로 쏙', unit: '점' },
  whack: { name: '별 콕콕', ic: 'star', desc: '튀어나온 별을 콕! 벌은 피하기', unit: '점' },
  catch: { name: '별 받기', ic: 'basket', desc: '바구니로 별 받기, 돌은 피하기', unit: '점' },
  memo: { name: '짝 맞추기', ic: 'heart', desc: '같은 그림 두 장 찾기', unit: '번 만에' },
  math: { name: '계산 달리기', ic: 'calc', desc: `${MATH_SEC}초 동안 셈 풀기`, unit: '문제' },
  word: { name: '영어 단어', ic: 'pencil', desc: '내 단어장으로 뜻 맞히기', unit: '개' },
};
const WORD_Q = 10;

function wordQs() {          // 많이 틀린 단어가 더 자주 나오게 골라 10문제
  const ws = S.words.slice(), pick = [], want = Math.min(WORD_Q, ws.length);
  const wt = w => Math.max(0.4, 1 + (w.wrong || 0) * 2 - (w.right || 0) * 0.5);
  while (pick.length < want) {
    const tot = ws.reduce((n, w) => n + wt(w), 0); let r = Math.random() * tot, i = 0;
    for (; i < ws.length - 1; i++) { r -= wt(ws[i]); if (r <= 0) break; }
    pick.push(ws.splice(i, 1)[0]);
  }
  return pick.map(w => {
    const dir = Math.random() < 0.7 ? 'en' : 'ko';           // en: 영어 보고 뜻 고르기
    const key = dir === 'en' ? 'ko' : 'en', ans = w[key];
    const others = shuffle([...new Set(S.words.filter(x => x.key !== w.key).map(x => x[key]))].filter(v => v !== ans)).slice(0, 3);
    return { w, dir, ans, opts: shuffle([ans, ...others]) };
  });
}
function wordPick(k) {
  const g = UI.game; if (!g || g.type !== 'word' || g.over) return;
  const q = g.q, v = q.opts[k]; if (v == null) return;
  const st = g.stats[q.w.key] || (g.stats[q.w.key] = { right: 0, wrong: 0 });
  if (v === q.ans) { g.score++; st.right++; g.fb = '맞았어요!'; g.good = true; }
  else { st.wrong++; g.miss.push(q.w); g.fb = `앗! ${q.w.en} = ${q.w.ko}`; g.good = false; }
  g.i++;
  if (g.i >= g.qs.length) { g.over = true; finishGame(); return; }
  g.q = g.qs[g.i]; render();
  if (g.q.dir === 'en' && UI.autoSay) speak(g.q.w.en);
}
let rafId = null;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let gameTimer = null;

function tasksLeft() {
  const st = S.settings, d = dayOf(today());
  return st.tasks.filter(t => !(d.done && d.done[t.id])).length;
}
/* 하루 게임 시간: 실제로 게임 화면에서 노는 동안만 1초씩 세고(결과 화면·앱 내려 둠은 안 셈), 날짜별 day.game(초)에 저장 */
let playSec = 0;                                   // 아직 저장 안 한 초
const gameLimitMin = () => { const v = S.settings.gameLimit; return v == null ? 30 : +v || 0; };
const playedSec = () => { const d = S.days[today()]; return ((d && d.game) || 0) + playSec; };
const gameTimeLeft = () => gameLimitMin() ? gameLimitMin() * 60 - playedSec() : Infinity;
function flushPlay() {                             // 다시 그리지 않고 저장만
  if (!playSec) return;
  const d = clone(dayOf(today())); d.game = (d.game || 0) + playSec; playSec = 0;
  docs['d-' + d.date] = dayBody(d); S = build(docs); localSave();
}
setInterval(() => {
  const g = UI.game; if (!g || g.over || document.hidden || UI.tab !== 'game') return;
  playSec++;
  const left = gameTimeLeft();
  const el = document.getElementById('gLeft');
  if (el) el.textContent = left <= 60 && left > 0 ? `${Math.ceil(left)}초 남았어요` : '';
  if (playSec >= 15) flushPlay();
  if (left <= 0) {                                 // 다 썼음: 게임 끝내고 잠금 화면으로
    flushPlay(); stopTimer(); UI.game = null;
    UI.msg = { game: `오늘 게임 시간 ${gameLimitMin()}분을 다 썼어요. 내일 또 해요!` }; UI.good = null;
    render(); window.scrollTo(0, 0);

}, 1000);

const gameOpen = () => (S.settings.gameLock === false || tasksLeft() === 0) && gameTimeLeft() > 0;

function mathQ() {
  let text, ans, near;
  switch (rnd(0, 4)) {
    case 0: { const a = rnd(120, 899), b = rnd(45, 99); text = `${a} + ${b}`; ans = a + b; near = 10; break; }
    case 1: { const a = rnd(150, 900), b = rnd(25, 99); text = `${a} − ${b}`; ans = a - b; near = 10; break; }
    case 2: { const a = rnd(12, 49), b = rnd(3, 9); text = `${a} × ${b}`; ans = a * b; near = b; break; }
    case 3: { const b = rnd(3, 9), q = rnd(4, 15); text = `${b * q} ÷ ${b}`; ans = q; near = 1; break; }
    default: { const a = rnd(6, 12), b = rnd(6, 12); text = `${a} × ${b}`; ans = a * b; near = a; }
  }
  const set = new Set([ans]);
  const tries = shuffle([ans + 1, ans - 1, ans + near, ans - near, ans + 2, ans - 2, ans + 10, ans - 10, ans + 11]);
  for (const v of tries) { if (set.size >= 4) break; if (v > 0) set.add(v); }
  return { text, ans, opts: shuffle([...set]) };
}

function startGame(type) {
  stopTimer();
  if (type === 'memo') {
    const cards = shuffle([...MEMO_ICONS, ...MEMO_ICONS]).map(ic => ({ ic, open: false, done: false }));
    UI.game = { type, cards, first: null, lock: false, moves: 0, found: 0, over: false };
  } else if (type === 'math') {
    UI.game = { type, end: Date.now() + MATH_SEC * 1000, q: mathQ(), score: 0, wrong: 0, fb: '', over: false };
    gameTimer = setInterval(tickMath, 250);
  } else if (type === 'whack') {
    const now = Date.now();
    UI.game = { type, end: now + WHACK_SEC * 1000, holes: Array(9).fill(null), score: 0, stars: 0, bees: 0, next: now + 600, over: false };
    gameTimer = setInterval(tickWhack, 50);
  } else if (type === 'word') {
    if (S.words.length < 4) { render(); return; }
    const qs = wordQs();
    UI.game = { type, qs, i: 0, q: qs[0], score: 0, miss: [], stats: {}, fb: '', over: false };
  } else if (type === 'run') {
    UI.game = { type, started: false, t: 0, dist: 0, speed: 0, y: null, vy: 0, jumps: 0, lives: 3, inv: 0, flash: 0,
      obs: [], stars: [], pops: [], next: 0, score: 0, starN: 0, last: 0, over: false };
  } else if (type === 'catch') {
    UI.game = { type, score: 0, stars: 0, hearts: 0, lives: 3, items: [], pops: [], bx: null, tx: null, t: 0, next: 0.6, last: 0, flash: 0, over: false };
  }
  render(); window.scrollTo(0, 0);
  if (type === 'catch') rafId = requestAnimationFrame(loopCatch);
  if (type === 'run') rafId = requestAnimationFrame(loopRun);
}
function stopTimer() {
  if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

/* 별 콕콕: 3×3 구멍, 별 +1 · 벌 −2, 30초, 갈수록 빨라짐 */
function tickWhack() {
  const g = UI.game; if (!g || g.type !== 'whack' || g.over) { stopTimer(); return; }
  const now = Date.now(), left = Math.max(0, g.end - now), f = 1 - left / (WHACK_SEC * 1000);
  const t = document.getElementById('gTime'), bar = document.getElementById('gBar');
  if (t) t.textContent = Math.ceil(left / 1000) + '초';
  if (bar) bar.style.width = (left / (WHACK_SEC * 10)) + '%';
  if (left <= 0) { g.over = true; stopTimer(); finishGame(); return; }
  g.holes.forEach((h, i) => { if (h && h.until <= now) g.holes[i] = null; });
  const active = g.holes.filter(h => h && (h.kind === 'star' || h.kind === 'bee')).length;
  if (now >= g.next && active < 1 + Math.floor(f * 3)) {
    const empty = g.holes.map((h, i) => h ? -1 : i).filter(i => i >= 0);
    if (empty.length) {
      const i = empty[rnd(0, empty.length - 1)];
      g.holes[i] = { kind: Math.random() < 0.22 ? 'bee' : 'star', until: now + 1000 - 450 * f };
    }
    g.next = now + (750 - 400 * f) * (0.7 + Math.random() * 0.6);
  }
  drawHoles();
}
function holeHtml(h) {
  if (!h) return '';
  if (h.kind === 'star') return ic('star', 'fill');
  if (h.kind === 'bee') return ic('bee');
  return h.kind === 'hit' ? '+1' : '−2';
}
function drawHoles() {
  const g = UI.game; if (!g || g.type !== 'whack') return;
  g.holes.forEach((h, i) => {
    const b = document.getElementById('wh-' + i); if (!b) return;
    const k = h ? h.kind : '';
    if (b.dataset.k === k) return;
    b.dataset.k = k; b.className = 'hole ' + k; b.innerHTML = holeHtml(h);
    b.setAttribute('aria-label', `${i + 1}번 구멍${k === 'star' ? ', 별!' : k === 'bee' ? ', 벌' : ''}`);
  });
  const s = document.getElementById('gScore'); if (s) s.textContent = g.score;
}
function whackHit(i) {
  const g = UI.game; if (!g || g.type !== 'whack' || g.over) return;
  const h = g.holes[i]; if (!h) return;
  const now = Date.now();
  if (h.kind === 'star') { g.score++; g.stars++; g.holes[i] = { kind: 'hit', until: now + 250 }; }
  else if (h.kind === 'bee') { g.score = Math.max(0, g.score - 2); g.bees++; g.holes[i] = { kind: 'ouch', until: now + 400 }; }
  drawHoles();
}

/* 별 받기: 바구니를 움직여 별 +1 · 하트 +3, 돌에 맞으면 목숨 −1 (3개) */
function catchColors() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return { paper: v('--paper'), sun: v('--sun'), berry: v('--berry'), onBerry: v('--on-berry'), ink: v('--ink'), mint: v('--mint') };
}
const HEART = typeof Path2D !== 'undefined' ? new Path2D('M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z') : null;
function loopCatch(ts) {
  const g = UI.game; if (!g || g.type !== 'catch' || g.over) { rafId = null; return; }
  const cv = document.getElementById('cv');
  if (!cv || !cv.clientWidth) { rafId = requestAnimationFrame(loopCatch); return; }
  const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const dt = g.last ? Math.min(50, ts - g.last) / 1000 : 0; g.last = ts; g.t += dt;
  if (!g.col) g.col = catchColors();
  const bw = Math.max(60, W * 0.24), bh = 22, by = H - bh - 10;
  if (g.bx == null) { g.bx = g.tx = W / 2; }
  g.tx = Math.max(bw / 2, Math.min(W - bw / 2, g.tx));
  g.bx += (g.tx - g.bx) * Math.min(1, dt * 20);
  const lv = Math.min(1, g.t / 60);
  g.next -= dt;
  if (g.next <= 0) {
    const r = Math.random(), kind = r < 0.27 ? 'rock' : r < 0.37 ? 'heart' : 'star';
    g.items.push({ kind, x: 20 + Math.random() * (W - 40), y: -20, r: kind === 'rock' ? 15 : 14, v: H * (0.38 + 0.5 * lv) * (0.85 + Math.random() * 0.3) });
    g.next = 0.95 - 0.55 * lv;
  }
  for (const it of g.items) {
    it.y += it.v * dt;
    if (!it.gone && it.y + it.r >= by && it.y - it.r <= by + bh && Math.abs(it.x - g.bx) < bw / 2 + it.r * 0.4) {
      it.gone = true;
      if (it.kind === 'rock') { g.lives--; g.flash = 0.35; g.pops.push({ x: it.x, y: by - 10, t: 0.7, txt: '앗!', c: g.col.berry }); }
      else if (it.kind === 'heart') { g.score += 3; g.hearts++; g.pops.push({ x: it.x, y: by - 10, t: 0.7, txt: '+3', c: g.col.berry }); }
      else { g.score++; g.stars++; g.pops.push({ x: it.x, y: by - 10, t: 0.7, txt: '+1', c: g.col.mint }); }
    }
  }
  g.items = g.items.filter(it => !it.gone && it.y - it.r < H);
  g.pops.forEach(p => { p.t -= dt; p.y -= 40 * dt; }); g.pops = g.pops.filter(p => p.t > 0);
  g.flash = Math.max(0, g.flash - dt);

  const ctx = cv.getContext('2d'), c = g.col;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (g.flash) { ctx.fillStyle = c.berry; ctx.globalAlpha = g.flash * 0.5; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  for (const it of g.items) {
    if (it.kind === 'star') {
      ctx.beginPath();
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? it.r * 0.45 : it.r; ctx.lineTo(it.x + Math.cos(a) * rr, it.y + Math.sin(a) * rr); }
      ctx.closePath(); ctx.fillStyle = c.sun; ctx.fill();
    } else if (it.kind === 'heart' && HEART) {
      const s = it.r / 8; ctx.save(); ctx.translate(it.x - 12 * s, it.y - 12 * s); ctx.scale(s, s); ctx.fillStyle = c.berry; ctx.fill(HEART); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fillStyle = '#7D8894'; ctx.fill();
      ctx.beginPath(); ctx.arc(it.x - 4, it.y - 3, 3, 0, Math.PI * 2); ctx.arc(it.x + 5, it.y + 4, 2.2, 0, Math.PI * 2); ctx.fillStyle = '#5B6570'; ctx.fill();
    }
  }
  const bx0 = g.bx - bw / 2;
  ctx.fillStyle = c.berry;
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx0, by, bw, bh, 7); else ctx.rect(bx0, by, bw, bh); ctx.fill();
  ctx.strokeStyle = c.onBerry; ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
  for (let x = bx0 + 12; x < bx0 + bw - 6; x += 12) { ctx.beginPath(); ctx.moveTo(x, by + 5); ctx.lineTo(x, by + bh - 5); ctx.stroke(); }
  ctx.globalAlpha = 1;
  ctx.font = '20px Jua, sans-serif'; ctx.textAlign = 'center';
  for (const p of g.pops) { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.c; ctx.fillText(p.txt, p.x, p.y); }
  ctx.globalAlpha = 1;

  const s = document.getElementById('gScore'); if (s) s.textContent = g.score;
  const l = document.getElementById('gLife'); if (l) { l.textContent = '♥'.repeat(Math.max(0, g.lives)) + '♡'.repeat(Math.max(0, 3 - g.lives)); l.setAttribute('aria-label', `목숨 ${Math.max(0, g.lives)}개`); }
  if (g.lives <= 0) { g.over = true; rafId = null; finishGame(); return; }
  rafId = requestAnimationFrame(loopCatch);
}
/* 별빛 달리기: 톡 = 점프(공중에서 한 번 더 = 2단 점프), 돌·책 더미는 뛰어넘고 벌은 밑으로, 별 모으기, 목숨 3 */
function runJump() {
  const g = UI.game; if (!g || g.type !== 'run' || g.over) return;
  if (!g.started) { g.started = true; g.last = 0; }
  if (g.jumps < 2) { g.vy = -(g.jv || 700) * (g.jumps ? 0.85 : 1); g.jumps++; }
}
function spawnRun(g, W, gy, k) {
  const r = Math.random(), lv = Math.min(1, g.t / 60);
  let o;
  if (r < 0.18 + 0.14 * lv) o = { kind: 'bee', w: 30 * k, h: 24 * k, y: gy - (72 + Math.random() * 18) * k };
  else if (r < 0.55) o = { kind: 'books', w: 26 * k, h: 48 * k, y: gy - 48 * k };
  else o = { kind: 'rock', w: 32 * k, h: 26 * k, y: gy - 26 * k };
  o.x = W + 20; o.ph = Math.random() * 6; g.obs.push(o);
  if (Math.random() < 0.65) {            // 장애물 위(벌이면 아래)에 별 줄
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const c = i - (n - 1) / 2, up = 1 - Math.abs(c) / (n / 2 + 0.5);

}
function starPath(ctx, x, y, r) {

}
function loopRun(ts) {
  const g = UI.game; if (!g || g.type !== 'run' || g.over) { rafId = null; return; }
  const cv = document.getElementById('rv');
  if (!cv || !cv.clientWidth) { rafId = requestAnimationFrame(loopRun); return; }
  const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const dt = g.last ? Math.min(50, ts - g.last) / 1000 : 0; g.last = ts;
  if (!g.col) g.col = catchColors();

    for (const o of g.obs) {
      if (o.hit || g.inv > 0) continue;
      const oy = o.kind === 'bee' ? o.y + Math.sin(g.t * 6 + o.ph) * 5 * k : o.y;
      if (pb.x < o.x + o.w - 4 * k && pb.x + pb.w > o.x + 4 * k && pb.y < oy + o.h - 4 * k && pb.y + pb.h > oy + 4 * k) {

      }
    }
    for (const s of g.stars) {
      if (!s.got && Math.abs(s.x - (px + ps / 2)) < ps / 2 + 8 * k && Math.abs(s.y - (g.y + ps / 2)) < ps / 2 + 8 * k) {
        s.got = true; g.starN++; g.pops.push({ x: s.x, y: s.y, t: 0.6, txt: '+10', c: g.col.mint });
      }
    }
    g.pops.forEach(p => { p.t -= dt; p.y -= 40 * dt; }); g.pops = g.pops.filter(p => p.t > 0);
    g.flash = Math.max(0, g.flash - dt);
    g.score = Math.floor(g.dist / (20 * k)) + g.starN * 10;
  }

  const ctx = cv.getContext('2d'), c = g.col;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // 먼 언덕·구름 (느리게 지나감)
  ctx.fillStyle = c.mint; ctx.globalAlpha = 0.12;
  for (let i = -1; i < 4; i++) { const x = ((i * 180 * k - g.dist * 0.15) % (720 * k) + 720 * k) % (720 * k) - 120 * k; ctx.beginPath(); ctx.arc(x, gy + 10 * k, 90 * k, Math.PI, 0); ctx.fill(); }
  ctx.globalAlpha = 0.5; ctx.fillStyle = '#FFFFFF';
  for (let i = 0; i < 3; i++) { const x = ((i * 230 * k - g.dist * 0.3) % (690 * k) + 690 * k) % (690 * k) - 60 * k, y = (40 + i * 28) * k; ctx.beginPath(); ctx.arc(x, y, 14 * k, 0, 7); ctx.arc(x + 16 * k, y - 6 * k, 18 * k, 0, 7); ctx.arc(x + 34 * k, y, 13 * k, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  // 땅
  ctx.fillStyle = c.mint; ctx.globalAlpha = 0.18; ctx.fillRect(0, gy, W, H - gy); ctx.globalAlpha = 1;
  ctx.fillStyle = c.mint; ctx.fillRect(0, gy, W, 3 * k);
  ctx.globalAlpha = 0.35;
  for (let x = -((g.dist) % (40 * k)); x < W; x += 40 * k) ctx.fillRect(x, gy + 12 * k, 16 * k, 3 * k);
  ctx.globalAlpha = 1;
  // 별
  for (const s of g.stars) { starPath(ctx, s.x, s.y, 9 * k); ctx.fillStyle = c.sun; ctx.fill(); }
  // 장애물
  for (const o of g.obs) {
    ctx.globalAlpha = o.hit ? 0.35 : 1;
    if (o.kind === 'rock') {
      ctx.fillStyle = '#7D8894'; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, o.y + o.h * 0.6, o.w / 2, o.h * 0.6, 0, Math.PI, 0); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.lineTo(o.x, o.y + o.h); ctx.fill();
      ctx.fillStyle = '#5B6570'; ctx.beginPath(); ctx.arc(o.x + o.w * 0.35, o.y + o.h * 0.55, 3 * k, 0, 7); ctx.fill();
    } else if (o.kind === 'books') {
      const cols = [c.berry, c.sun, c.mint], bh = o.h / 3;
      for (let i = 0; i < 3; i++) { ctx.fillStyle = cols[i]; const off = (i % 2 ? 3 : -2) * k; ctx.fillRect(o.x + off, o.y + o.h - bh * (i + 1) + 1, o.w, bh - 2); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(o.x + off + 3 * k, o.y + o.h - bh * (i + 1) + bh / 2 - 1, o.w - 6 * k, 2 * k); }
    } else {
      const oy = o.y + Math.sin(g.t * 6 + o.ph) * 5 * k, cx = o.x + o.w / 2, cy = oy + o.h / 2;
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(cx - 4 * k, oy + 2 * k, 6 * k, 8 * k, -0.4, 0, 7); ctx.ellipse(cx + 5 * k, oy + 2 * k, 5 * k, 7 * k, 0.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#F5C24C'; ctx.beginPath(); ctx.ellipse(cx, cy + 2 * k, o.w / 2, o.h / 2.6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#22314A'; ctx.fillRect(cx - 4 * k, cy - 6 * k, 3 * k, 14 * k); ctx.fillRect(cx + 3 * k, cy - 6 * k, 3 * k, 14 * k);
      ctx.beginPath(); ctx.arc(o.x + 3 * k, cy + 1 * k, 4 * k, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // 주인공: 리본 단 동글이 (다치면 깜빡)
  if (!(g.inv > 0 && Math.floor(g.inv * 10) % 2)) {
    const x = px, y = g.y, s = ps, step = g.y >= gy - ps - 0.5 && g.started ? Math.floor(g.dist / (14 * k)) % 2 : 0;
    ctx.fillStyle = c.ink;
    ctx.fillRect(x + s * 0.25, y + s - 2 * k + (step ? -2 * k : 0), s * 0.16, 7 * k);
    ctx.fillRect(x + s * 0.6, y + s - 2 * k + (step ? 0 : -2 * k), s * 0.16, 7 * k);
    ctx.fillStyle = c.berry; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, s, s, 11 * k); else ctx.rect(x, y, s, s); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + s * 0.62, y + s * 0.42, 5 * k, 0, 7); ctx.arc(x + s * 0.86, y + s * 0.42, 4 * k, 0, 7); ctx.fill();
    ctx.fillStyle = '#22314A'; ctx.beginPath(); ctx.arc(x + s * 0.65, y + s * 0.43, 2.4 * k, 0, 7); ctx.arc(x + s * 0.88, y + s * 0.43, 2 * k, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(x + s * 0.5, y + s * 0.68, 3 * k, 0, 7); ctx.fill();
    ctx.fillStyle = c.sun; ctx.beginPath(); ctx.moveTo(x + s * 0.3, y + 2 * k); ctx.lineTo(x + s * 0.08, y - 7 * k); ctx.lineTo(x + s * 0.1, y + 7 * k); ctx.closePath();
    ctx.moveTo(x + s * 0.3, y + 2 * k); ctx.lineTo(x + s * 0.52, y - 7 * k); ctx.lineTo(x + s * 0.5, y + 7 * k); ctx.closePath(); ctx.fill();
  }
  if (g.flash) { ctx.fillStyle = c.berry; ctx.globalAlpha = g.flash * 0.4; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.textAlign = 'center';
  ctx.font = `${18 * k}px Jua, sans-serif`;
  for (const p of g.pops) { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.c; ctx.fillText(p.txt, p.x, p.y); }
  ctx.globalAlpha = 1;
  if (!g.started) {
    ctx.fillStyle = c.ink; ctx.font = `${22 * k}px Jua, sans-serif`; ctx.fillText('화면을 톡! 누르면 출발', W / 2, H * 0.36);
    ctx.font = `${15 * k}px Jua, sans-serif`; ctx.fillStyle = c.berry; ctx.fillText('공중에서 한 번 더 누르면 2단 점프', W / 2, H * 0.36 + 26 * k);
  }

  const st = document.getElementById('gStar'); if (st) st.textContent = g.starN;
  const l = document.getElementById('gLife'); if (l) { l.textContent = '♥'.repeat(Math.max(0, g.lives)) + '♡'.repeat(Math.max(0, 3 - g.lives)); l.setAttribute('aria-label', `목숨 ${Math.max(0, g.lives)}개`); }

document.addEventListener('keydown', e => {

function catchMoveTo(clientX) {
  const g = UI.game, cv = document.getElementById('cv'); if (!g || g.type !== 'catch' || !cv) return;
  g.tx = clientX - cv.getBoundingClientRect().left;
}
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-act=whit]'); if (h) { e.preventDefault(); whackHit(+h.dataset.i); return; }
  if (e.target.id === 'rv') { e.preventDefault(); runJump(); return; }
  if (e.target.id === 'cv') { try { e.target.setPointerCapture(e.pointerId); } catch (err) {} catchMoveTo(e.clientX); }
});
document.addEventListener('pointermove', e => { if (e.target.id === 'cv' && (e.buttons || e.pointerType !== 'mouse')) catchMoveTo(e.clientX); });
document.addEventListener('keydown', e => {
  const g = UI.game; if (!g || g.type !== 'catch' || g.over) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const cv = document.getElementById('cv'); if (!cv) return;
  e.preventDefault();
  if (g.tx == null) g.tx = cv.clientWidth / 2;
  g.tx += (e.key === 'ArrowLeft' ? -1 : 1) * cv.clientWidth * 0.12;
});

function tickMath() {
  const g = UI.game; if (!g || g.type !== 'math' || g.over) { stopTimer(); return; }
  const left = Math.max(0, g.end - Date.now());
  const t = document.getElementById('gTime'), bar = document.getElementById('gBar');
  if (t) t.textContent = Math.ceil(left / 1000) + '초';
  if (bar) bar.style.width = (left / (MATH_SEC * 10)) + '%';
  if (left <= 0) { g.over = true; stopTimer(); finishGame(); }
}

function finishGame() {
  flushPlay();
  const g = UI.game, gs = { ...S.games, kind: 'games' }, key = g.type + 'Best';
  const val = g.type === 'memo' ? g.moves : g.score;
  g.newBest = g.type === 'memo' ? (!gs[key] || val < gs[key]) : val > (gs[key] || 0);
  if (g.newBest) gs[key] = val;
  gs.plays = (gs.plays || 0) + 1;
  const map = { games: gs };
  if (g.type === 'word') for (const [k, s] of Object.entries(g.stats)) {   // 단어마다 맞힘·틀림 횟수
    const w = docs[k]; if (w) map[k] = { ...w, right: (w.right || 0) + s.right, wrong: (w.wrong || 0) + s.wrong };
  }
  putMany(map);       // 저장 + 다시 그리기
}

function memoFlip(i) {
  const g = UI.game; if (!g || g.type !== 'memo' || g.lock || g.over) return;
  const c = g.cards[i]; if (!c || c.open || c.done) return;
  c.open = true;
  if (g.first === null) { g.first = i; render(); return; }
  const a = g.cards[g.first]; g.moves++;
  if (a.ic === c.ic) {
    a.done = c.done = true; a.open = c.open = false; g.first = null; g.found++;
    if (g.found === MEMO_ICONS.length) { g.over = true; finishGame(); return; }
    render(); return;
  }
  g.lock = true; render();
  setTimeout(() => {
    if (UI.game !== g) return;
    a.open = c.open = false; g.first = null; g.lock = false; render();
  }, 850);
}

function mathPick(v) {
  const g = UI.game; if (!g || g.type !== 'math' || g.over) return;
  if (Date.now() >= g.end) { tickMath(); return; }
  if (v === g.q.ans) { g.score++; g.fb = '맞았어요!'; g.good = true; }
  else { g.wrong++; g.fb = `앗! ${g.q.text} = ${g.q.ans}`; g.good = false; }
  g.q = mathQ(); render();
}

  const ym = t.slice(0, 7);
  const mDays = Object.values(S.days).filter(d => d.date.startsWith(ym));
  const mStk = mDays.reduce((n, d) => n + Object.values(d.done || {}).filter(Boolean).length, 0);
  const mStudy = mDays.reduce((n, d) => n + (+d.study || 0), 0);
  let streak = 0;
  for (let d = t; ; d = addDays(d, -1)) {
    const x = S.days[d]; const n = x ? st.tasks.filter(k => x.done && x.done[k.id]).length : 0;
    if (st.tasks.length && n === st.tasks.length) streak++; else if (d !== t) break; else continue;
    if (streak > 400) break;
  }
  return `
  <section class="card">
    <div class="card-h"><h2>${+ym.slice(5)}월 모아 보기</h2></div>
    <div class="mini">
      <div><span class="muted">모은 스티커</span><b>${mStk}개</b></div>
      <div><span class="muted">공부 시간</span><b>${Math.floor(mStudy / 60)}시간 ${mStudy % 60}분</b></div>
      <div><span class="muted">다 한 날 연속</span><b>${streak}일</b></div>
      <div><span class="muted">받은 보상</span><b>${S.rewards.filter(r => r.date.startsWith(ym)).length}번</b></div>
    </div>
  </section>
  <section class="card">
    <div class="card-h"><h2>최근 2주</h2><span class="muted">옆으로 밀어 보세요</span></div>
    <div class="tbl-wrap"><table class="grid"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}${studyRow}</tbody></table></div>
  </section>
  <section class="card">
    <div class="card-h"><h2>한 줄 일기</h2><span class="muted">최근 2주</span></div>
    ${notes.length ? `<ul class="list">${notes.map(x => `<li class="row"><span class="muted num" style="width:42px">${shortDate(x.date)}</span><span aria-hidden="true">${x.mood ? MOODS[x.mood - 1].e : ''}</span><span class="grow">${esc(x.note || (x.mood ? MOODS[x.mood - 1].t : ''))}</span></li>`).join('')}</ul>` : `<div class="empty">오늘 탭에서 기분을 고르고 한 줄 일기를 써 보세요.</div>`}
  </section>
  <section class="card">
    <div class="card-h"><h2>받은 보상</h2></div>
    ${S.rewards.length ? `<ul class="list">${S.rewards.slice(0, 20).map(r => `<li class="row"><span class="muted num" style="width:42px">${shortDate(r.date)}</span><span class="grow">${esc(r.name)}</span><span class="amt" style="color:var(--sun-ink)">★ ${r.cost}</span></li>`).join('')}</ul>` : `<div class="empty">스티커를 모아 보상을 받으면 여기 남아요.</div>`}
  </section>`;
}

/* ---------- 누르기 ---------- */
const dayBody = d => ({ ...d, kind: 'day', date: d.date, done: d.done || {}, study: d.study || 0, hw: d.hw || [] });
function saveDay(d) { put('d-' + d.date, dayBody(d)); }
function saveSettings(st) { put('settings', { ...clone(st), kind: 'settings' }); }

function arm(btn, label, fn) {
  if (btn.dataset.armed) { fn(); return; }
  btn.dataset.armed = '1'; btn.classList.add('armed');
  const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = old; } }, 3000);
}

document.addEventListener('click', e => {
  const tab = e.target.closest('nav.tabs button');
  if (tab) { flushPlay(); stopTimer(); UI.game = null; UI.parentOk = false; UI.tab = tab.dataset.tab; UI.msg = {}; UI.copyOut = ''; UI.acEdit = null; UI.acDays = []; if (UI.tab === 'sched') UI.wk = null; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const d = clone(dayOf(UI.date));
  switch (act) {
    case 'prev': UI.date = addDays(UI.date, -1); UI.followToday = false; render(); break;
    case 'next': if (UI.date < today()) { UI.date = addDays(UI.date, 1); UI.followToday = UI.date === today(); render(); } break;
    case 'gotoday': UI.date = today(); UI.followToday = true; render(); break;
    case 'task': d.done = d.done || {}; d.done[b.dataset.id] = !d.done[b.dataset.id]; if (!d.done[b.dataset.id]) delete d.done[b.dataset.id]; saveDay(d); break;
    case 'hw': d.hw[+b.dataset.i].done = !d.hw[+b.dataset.i].done; saveDay(d); break;
    case 'hwdel': arm(b, '정말?', () => { d.hw.splice(+b.dataset.i, 1); saveDay(d); }); break;
    case 'study': d.study = Math.max(0, Math.min(1440, (d.study || 0) + +b.dataset.n)); saveDay(d); break;
    case 'redeem': {
      const st = S.settings, goal = Math.max(1, +st.goal || 30);
      arm(b, '한 번 더 누르면 받아요', () => put(uid('r'), { kind: 'reward', date: today(), at: new Date().toISOString(), name: st.reward, cost: goal }));
      break;
    }
    case 'ssub': UI.studySub = b.dataset.v; UI.msg = {}; render(); break;
    case 'say': { const w = S.words.find(x => x.key === b.dataset.key); if (w) speak(w.en); break; }
    case 'gsay': if (UI.game && UI.game.type === 'word') speak(UI.game.q.w.en); break;
    case 'allwords': UI.allWords = !UI.allWords; render(); break;
    case 'wbulk': {
      const t = document.getElementById('wBulk'), have = new Set(S.words.map(w => w.en.toLowerCase())), add = {};
      let n = 0, skip = 0; const now = Date.now();
      for (const line of t.value.split(/\n/)) {
        const s = line.trim(); if (!s) continue;
        const m = s.match(/^(.+?)\s*[-:=\t]\s*(.+)$/) || s.match(/^([A-Za-z][A-Za-z' .]*?)\s+([^A-Za-z].*)$/);
        if (!m) { skip++; continue; }
        const en = m[1].trim().slice(0, 40), ko = m[2].trim().slice(0, 40);
        if (!en || !ko || have.has(en.toLowerCase())) { skip++; continue; }
        have.add(en.toLowerCase());
        add[uid('v')] = { kind: 'word', en, ko, at: new Date(now + n).toISOString(), right: 0, wrong: 0 }; n++;
        if (n >= 300) break;
      }
      UI.msg = { word: n ? `단어 ${n}개를 넣었어요.${skip ? ` (${skip}줄은 겹치거나 모양이 달라서 뺐어요)` : ''}` : '넣을 단어를 못 찾았어요. 한 줄에 "apple 사과" 처럼 적어 주세요.' };
      UI.good = n ? 'word' : null;
      if (n) { t.value = ''; putMany(add); } else render();
      break;
    }
    case 'rpage': case 'rplus': {
      const r = S.reading.find(x => x.key === b.dataset.key); if (!r) break;
      let p;
      if (act === 'rplus') p = r.page + 10;
      else { const i = document.getElementById('rp-' + r.key); p = parseInt((i.value || '').replace(/\D/g, ''), 10); if (isNaN(p)) { i.focus(); break; } i.value = ''; }
      p = Math.max(0, Math.min(r.total, p));
      const delta = p - r.page, map = { [r.key]: { kind: 'reading', title: r.title, total: r.total, page: p, start: r.start, at: new Date().toISOString() } };
      if (delta > 0) { const t = clone(dayOf(today())); t.read = (t.read || 0) + delta; map['d-' + t.date] = dayBody(t); }
      UI.msg = { read: p >= r.total ? `${r.title} 끝까지 읽었어요! [다 읽었어요!]를 눌러 책장에 넣어요.` : delta > 0 ? `${delta}쪽 읽었어요.` : '쪽수를 바꿨어요.' }; UI.good = 'read';
      putMany(map);
      break;
    }
    case 'rdone': {
      const r = S.reading.find(x => x.key === b.dataset.key); if (!r) break;
      UI.finishing = r.key; UI.msg = { book: '별점과 한 줄 느낌을 적고 [책 넣기]를 눌러요.' }; UI.good = 'book';
      render();
      const ti = document.getElementById('bTitle'); if (ti) { ti.value = r.title; ti.scrollIntoView({ block: 'center' }); }
      break;
    }
    case 'skin': { const st = clone(S.settings); st.theme = b.dataset.v; saveSettings(st); break; }
    case 'ankind': UI.anKind = b.dataset.v; render(); break;
    case 'andel': arm(b, '정말?', () => { const st = clone(S.settings); st.anniv.splice(+b.dataset.i, 1); saveSettings(st); }); break;
    case 'mcat': UI.mcat = b.dataset.v; render(); break;
    case 'mmonth': UI.mMonth = b.dataset.v > today().slice(0, 7) ? today().slice(0, 7) : b.dataset.v; render(); break;
    case 'mood': { const n = +b.dataset.n; d.mood = d.mood === n ? 0 : n; if (!d.mood) delete d.mood; saveDay(d); break; }
    case 'gosched': UI.tab = 'sched'; UI.wk = null; UI.msg = {}; render(); window.scrollTo(0, 0); break;
    case 'wk': { const n = +b.dataset.n; UI.wk = addDays(UI.wk, n); UI.sday = addDays(UI.sday, n); UI.msg = {}; render(); break; }
    case 'sday': UI.sday = b.dataset.d; render(); break;
    case 'acday': { const x = +b.dataset.w, s = new Set(UI.acDays || []); s.has(x) ? s.delete(x) : s.add(x); UI.acDays = [...s]; render(); break; }
    case 'acdel': arm(b, '정말?', () => {
      const st = clone(S.settings), gone = st.academies.splice(+b.dataset.i, 1)[0];
      if (gone && gone.id === UI.acEdit) { UI.acEdit = null; UI.acDays = []; ['acName', 'acStart', 'acEnd', 'acBring'].forEach(id => { const x = document.getElementById(id); if (x) x.value = ''; }); }
      saveSettings(st);
    }); break;
    case 'acedit': {
      const a = (S.settings.academies || [])[+b.dataset.i]; if (!a) break;
      UI.acEdit = a.id; UI.acDays = (a.days || []).slice(); UI.msg = {};
      render();
      const set = (id, v) => { const x = document.getElementById(id); if (x) x.value = v || ''; };
      set('acName', a.name); set('acStart', a.start); set('acEnd', a.end); set('acBring', a.bring);
      const e = document.getElementById('acEditing'); if (e) e.scrollIntoView({ block: 'start' });
      break;
    }
    case 'accancel':
      UI.acEdit = null; UI.acDays = []; UI.msg = {};
      ['acName', 'acStart', 'acEnd', 'acBring'].forEach(id => { const x = document.getElementById(id); if (x) x.value = ''; });
      render(); break;
    case 'wkprompt': copyText(WEEK_PROMPT, 'wk', '부탁 글을 복사했어요. Claude 앱에 사진과 같이 보내 주세요.'); break;
    case 'mealprompt': copyText(MEAL_PROMPT, 'wk', '급식 부탁 글을 복사했어요. Claude 앱에 급식표 사진과 같이 보내 주세요.'); break;
    case 'wkadd': {
      const t = document.getElementById('wkIn'), j = parseLoose(t.value);
      const ms = parseMeals(j), ws = ms ? null : parseWeeks(j);
      if (!ws && !ms) { UI.msg = { wk: 'Claude가 준 글이 아니거나 잘렸어요. { 부터 } 까지 통째로 붙여 넣어 주세요.' }; UI.good = null; render(); break; }
      if (ws) {
        for (const w of ws) docs['w-' + w.start] = w;
        UI.wk = ws[0].start; UI.sday = (ws[0].days.find(d => d.date >= today()) || ws[0].days[0]).date;
        UI.msg = { wk: `${ws.map(w => shortDate(w.start) + ' 주').join(', ')} 시간표를 넣었어요.` };
      } else {
        for (const m of ms) docs['l-' + m.month] = m;
        UI.msg = { wk: `${ms.map(m => +m.month.slice(5) + '월').join(', ')} 급식표를 넣었어요 (${ms.reduce((n, m) => n + m.days.length, 0)}일).` };
      }
      S = build(docs); localSave();
      t.value = ''; UI.good = 'wk';
      render(); window.scrollTo(0, 0);
      break;
    }
    case 'allergy': { const st = clone(S.settings), n = +b.dataset.n, s = new Set(st.allergy || []); s.has(n) ? s.delete(n) : s.add(n); st.allergy = [...s].sort((a, c) => a - c); saveSettings(st); break; }
    case 'gstart': if (gameOpen()) startGame(b.dataset.g); else render(); break;
    case 'gquit': flushPlay(); stopTimer(); UI.game = null; render(); break;
    case 'glimit': { if (parentLocked()) break; const st = clone(S.settings); st.gameLimit = +b.dataset.v; saveSettings(st); break; }
    case 'pinlock': UI.parentOk = false; UI.msg = {}; render(); break;
    case 'pinoff': arm(b, '정말 없앨까요?', () => { const st = clone(S.settings); delete st.pinHash; UI.parentOk = false; UI.msg = { pinset: '비밀번호를 없앴어요. 이제 누구나 바꿀 수 있어요.' }; UI.good = 'pinset'; saveSettings(st); }); break;
    case 'mflip': memoFlip(+b.dataset.i); break;
    case 'wpick': wordPick(+b.dataset.k); break;
    case 'whit': if (e.detail === 0) whackHit(+b.dataset.i); break;   // 키보드(Enter·Space)만, 손가락·마우스는 pointerdown 에서
    case 'mpick': mathPick(+b.dataset.v); break;
    case 'glock': { if (parentLocked()) break; const st = clone(S.settings); st.gameLock = b.dataset.v === 'on'; saveSettings(st); break; }
    case 'mtype': UI.moneyType = b.dataset.v; UI.msg = {}; render(); break;
    case 'mquick': { const i = document.getElementById('mAmt'); i.value = String((parseInt(i.value.replace(/\D/g, ''), 10) || 0) + +b.dataset.n); break; }
    case 'mclear': document.getElementById('mAmt').value = ''; break;
    case 'bstar': UI.stars = UI.stars === +b.dataset.n ? 0 : +b.dataset.n; render(); break;
    case 'del': arm(b, '정말 지울까?', () => put(b.dataset.key, null)); break;
    case 'ticon': { const st = clone(S.settings), t = st.tasks[+b.dataset.i]; t.ic = TASK_ICONS[(TASK_ICONS.indexOf(t.ic) + 1) % TASK_ICONS.length]; saveSettings(st); break; }
    case 'tdel': arm(b, '정말?', () => { const st = clone(S.settings); st.tasks.splice(+b.dataset.i, 1); saveSettings(st); }); break;
    case 'bcopy': {
      const text = JSON.stringify({ app: 'bonaDiary', v: 1, at: today(), docs });
      UI.msg = {};
      const done = () => { UI.backupText = ''; UI.msg = { bk: '복사했어요. 카톡에 붙여 넣어 보내 두세요.' }; UI.good = 'bk'; render(); };
      const fail = () => { UI.backupText = text; render(); const t = document.getElementById('bkOut'); if (t) { t.focus(); t.select(); } };
      try { navigator.clipboard.writeText(text).then(done, fail); } catch (err) { fail(); }
      break;
    }
    case 'brestore': {
      if (parentLocked()) break;
      const t = document.getElementById('bkIn'), raw = (t.value || '').trim();
      let data = null;
      try { const j = JSON.parse(raw); if (j && j.app === 'bonaDiary' && j.docs && typeof j.docs === 'object') data = j.docs; } catch (err) {}
      if (!data) { UI.msg = { bk: '백업 글이 아니에요. 복사한 글을 처음부터 끝까지 붙여 넣어 주세요.' }; UI.good = null; render(); break; }
      arm(b, '지금 기록이 바뀌어요. 한 번 더!', () => {
        docs = data; S = build(docs); localSave(); t.value = ''; UI.msg = { bk: '되살렸어요.' }; UI.good = 'bk'; render();
      });
      break;
    }
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'hw') {
    const i = document.getElementById('hwText'), t = i.value.trim(); if (!t) { i.focus(); return; }
    const d = clone(dayOf(UI.date)); d.hw = d.hw || []; d.hw.push({ t, done: false });
    i.value = ''; saveDay(d);
  } else if (kind === 'money') {
    const ai = document.getElementById('mAmt'), mi = document.getElementById('mMemo');
    const n = parseInt(ai.value.replace(/[^\d]/g, ''), 10);
    if (!n || n <= 0) { UI.msg = { money: '얼마인지 숫자로 적어 주세요. 예: 5000' }; render(); document.getElementById('mAmt').focus(); return; }
    if (n > 10000000) { UI.msg = { money: '천만 원보다 큰 돈은 적을 수 없어요' }; render(); return; }
    const memo = mi.value.trim();
    UI.msg = {}; ai.value = ''; mi.value = '';
    const rec = { kind: 'money', date: today(), at: new Date().toISOString(), type: UI.moneyType, amount: n, memo };
    if (UI.moneyType === 'out') rec.cat = UI.mcat || '간식';
    put(uid('m'), rec);
  } else if (kind === 'book') {
    const ti = document.getElementById('bTitle'), ni = document.getElementById('bNote');
    const title = ti.value.trim();
    if (!title) { UI.msg = { book: '책 제목을 적어 주세요' }; render(); document.getElementById('bTitle').focus(); return; }
    const note = ni.value.trim(), stars = UI.stars;
    UI.msg = {}; UI.stars = 0; ti.value = ''; ni.value = '';
    const map = { [uid('b')]: { kind: 'book', date: today(), at: new Date().toISOString(), title, stars, note } };
    if (UI.finishing && docs[UI.finishing]) map[UI.finishing] = null;   // 읽는 중 → 책장으로
    UI.finishing = null;
    putMany(map);
  } else if (kind === 'word') {
    const ei = document.getElementById('wEn'), ki = document.getElementById('wKo');
    const en = ei.value.trim(), ko = ki.value.trim();
    if (!en || !ko) { UI.msg = { word: '영어와 뜻을 둘 다 적어 주세요' }; UI.good = null; render(); document.getElementById(en ? 'wKo' : 'wEn').focus(); return; }
    if (S.words.some(w => w.en.toLowerCase() === en.toLowerCase())) { UI.msg = { word: `${en} 은(는) 이미 단어장에 있어요` }; UI.good = null; render(); return; }
    ei.value = ''; ki.value = ''; UI.msg = { word: `${en} 넣었어요.` }; UI.good = 'word';
    put(uid('v'), { kind: 'word', en, ko, at: new Date().toISOString(), right: 0, wrong: 0 });
    document.getElementById('wEn').focus();
  } else if (kind === 'reading') {
    const ti = document.getElementById('rTitle'), pi = document.getElementById('rTotal');
    const title = ti.value.trim(), total = parseInt(pi.value.replace(/\D/g, ''), 10);
    if (!title || !total || total > 5000) { UI.msg = { read: !title ? '책 제목을 적어 주세요' : '전체 쪽수를 숫자로 적어 주세요 (예: 180)' }; UI.good = null; render(); return; }
    ti.value = ''; pi.value = ''; UI.msg = {};
    put(uid('rd'), { kind: 'reading', title, total, page: 0, start: today(), at: new Date().toISOString() });
  } else if (kind === 'pin') {
    const i = document.getElementById('pinIn'), v = (i.value || '').trim(); i.value = '';
    if (UI.pinBlock && UI.pinBlock > Date.now()) { render(); return; }
    if (pinHash(v) === S.settings.pinHash) { UI.parentOk = true; UI.pinFails = 0; UI.msg = { pinset: '잠금을 열었어요. 다른 탭으로 가면 다시 잠겨요.' }; UI.good = 'pinset'; render(); return; }
    UI.pinFails = (UI.pinFails || 0) + 1;
    if (UI.pinFails >= 5) { UI.pinFails = 0; UI.pinBlock = Date.now() + 60000; setTimeout(() => { if (UI.tab === 'set') render(); }, 60500); }
    UI.msg = { pin: '비밀번호가 달라요.' }; UI.good = null; render();
    const n = document.getElementById('pinIn'); if (n && !n.disabled) n.focus();
  } else if (kind === 'pinset') {
    if (parentLocked()) return;
    const a = document.getElementById('pinNew').value.trim(), b2 = document.getElementById('pinNew2').value.trim();
    const err = !/^\d{4}$/.test(a) ? '숫자 4자리로 적어 주세요' : a !== b2 ? '두 칸의 비밀번호가 달라요' : '';
    document.getElementById('pinNew').value = ''; document.getElementById('pinNew2').value = '';
    if (err) { UI.msg = { pinset: err }; UI.good = null; render(); return; }
    const st = clone(S.settings), had = !!st.pinHash; st.pinHash = pinHash(a);
    UI.parentOk = false; UI.msg = { pin: had ? '비밀번호를 바꾸고 잠갔어요.' : '비밀번호를 정하고 잠갔어요. 이제 부모님만 바꿀 수 있어요.' }; UI.good = 'pin';
    saveSettings(st);
  } else if (kind === 'anniv') {
    const ni = document.getElementById('anName'), name = ni.value.trim();
    const m = +document.getElementById('anM').value, d = +document.getElementById('anD').value;
    const maxD = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
    const err = !name ? '이름을 적어 주세요' : d > maxD ? `${m}월에는 ${d}일이 없어요` : '';
    if (err) { UI.msg = { anniv: err }; UI.good = null; render(); return; }
    ni.value = ''; UI.msg = { anniv: `${name} ${m}월 ${d}일 넣었어요.` }; UI.good = 'anniv';
    const st = clone(S.settings); st.anniv = st.anniv || [];
    st.anniv.push({ id: uid('n'), name, m, d, kind: UI.anKind || '생일' });
    saveSettings(st);
  } else if (kind === 'note') {
    const i = f.querySelector('input'), d = clone(dayOf(UI.date)), v = i.value.trim();
    if (v) d.note = v; else delete d.note;
    UI.msg = { note: v ? '한 줄 일기를 저장했어요.' : '한 줄 일기를 지웠어요.' }; UI.good = 'note';
    saveDay(d);
  } else if (kind === 'acad') {
    const name = document.getElementById('acName').value.trim(), days = UI.acDays || [];
    const start = document.getElementById('acStart').value, end = document.getElementById('acEnd').value;
    const bring = document.getElementById('acBring').value.trim();
    const err = !name ? '학원 이름을 적어 주세요' : !days.length ? '가는 요일을 하나 이상 눌러 주세요' : !start ? '시작 시간을 넣어 주세요' : end && end <= start ? '끝 시간이 시작보다 늦어야 해요' : '';
    if (err) { UI.msg = { acad: err }; UI.good = null; render(); return; }
    ['acName', 'acStart', 'acEnd', 'acBring'].forEach(id => { document.getElementById(id).value = ''; });
    const st = clone(S.settings); st.academies = st.academies || [];
    const body = { name, days: days.slice().sort(), start, end, bring };
    const at = UI.acEdit ? st.academies.findIndex(a => a.id === UI.acEdit) : -1;
    if (at >= 0) { st.academies[at] = { ...st.academies[at], ...body }; UI.msg = { acad: `${name} 고쳤어요.` }; }
    else { st.academies.push({ id: uid('a'), ...body }); UI.msg = { acad: `${name} 넣었어요.` }; }
    UI.good = 'acad'; UI.acDays = []; UI.acEdit = null;
    saveSettings(st);
  } else if (kind === 'task') {
    const i = document.getElementById('newTask'), name = i.value.trim(); if (!name) { i.focus(); return; }
    const st = clone(S.settings); st.tasks.push({ id: uid('t'), name, ic: 'star' });
    i.value = ''; saveSettings(st);
  }
});

// 설정 칸: 다 고치고 칸을 벗어날 때 한 번 저장
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id && el.id.startsWith('note-')) {      // 저장을 안 눌러도 칸을 벗어나면 저장
    const date = el.id.slice(5), d = clone(dayOf(date)), v = el.value.trim();
    if ((d.note || '') === v) return;
    if (v) d.note = v; else delete d.note;
    UI.msg = { note: v ? '한 줄 일기를 저장했어요.' : '한 줄 일기를 지웠어요.' }; UI.good = 'note';
    put('d-' + date, dayBody(d));
    return;
  }
  if (el.dataset.tname != null) {
    const st = clone(S.settings), v = el.value.trim(); if (!v) { el.value = st.tasks[+el.dataset.tname].name; return; }
    st.tasks[+el.dataset.tname].name = v; saveSettings(st);
  } else if (el.dataset.skey) {
    const st = clone(S.settings), k = el.dataset.skey;
    if (k === 'goal' || k === 'saveGoal') {
      const n = parseInt(el.value.replace(/[^\d]/g, ''), 10);
      const lim = k === 'goal' ? [1, 1000] : [1, 100000000];
      if (!n || n < lim[0] || n > lim[1]) { UI.msg = { set: k === 'goal' ? '스티커 개수는 1~1000 사이로 적어 주세요' : '목표 금액을 숫자로 적어 주세요' }; el.value = st[k]; render(); return; }
      st[k] = n;
    } else { const v = el.value.trim(); if (!v) { el.value = st[k]; return; } st[k] = v; }
    UI.msg = {}; saveSettings(st);
  }
});

// 자정이 지나 다시 열면 오늘로
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

initStore();
</script>
